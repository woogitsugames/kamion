  # ---------------------------------------------------------------- life rules
  - id: tyre-scrub-not-on-the-street
    kind: life_rules
    tyre_scrub_off_roads: true
    reason: >-
      ADR 0174 item 6: dock tyre-scrub decals (16-24 m in front of every dock door) of halls standing at the street
      ran onto the carriageway of Kuronia and read as stains on a straight trunk road. Scrub marks belong to the
      yard where trucks reverse onto the doors: a pass now ends before the public carriageway. Opt-in per region
      (the reference region C keeps its output byte for byte).
    confidence: high
    verify: none
