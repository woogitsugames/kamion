# 2024 0.25 m (Data/raw/derived/bialystok-dojlidy/ortho_0p25m.tif), BDOT10k, LoD1 2024, CC0 photos Commons / Rakoon
# (P11-001, P11-063, P11-056, P11-094; REVIEW-2026-11-13-s17-mistral-r8-p11-p12 par. 4). No lettering, no brands.
overrides:
  # ---------------------------------------------------------------- landmarks P0 (photo P11-001, P11-063)
  - id: kuronia3-office-block
    kind: building_part
    name: tall west block of the hall at Kuronia 3
    polygon_en: [[322.9, 495.2], [369.6, 491.9], [372.2, 491.7], [372.0, 527.7], [364.6, 528.2], [364.1, 520.5],
                 [357.1, 520.9], [329.4, 507.5], [323.8, 507.8]]
    cut_from: ["bdot:27a0721d-eb46-4021-a0be-dc26db73e398"]
    height_m: 14.0
    storeys: 4
    function: biurowiec
    reason: >-
      BDOT10k draws the hall at Kuronia 3 as one outline with the LoD1 2024 height 6.01 m. CC0 photo P11-001
      (Rakoon 2024-06-23, from the gate west of the hall): the west end of the complex is a tall light grey block,
      the tallest object of the frame - a west face ~11 m wide (two window rows, a dock with a canopy on the ground
      floor) and a long south face along Kuronia with three rows of ribbon windows that ends at a glazed stair
      strip. Bearings from the camera (local 253.9 475.8, heading 90 deg, f = 753 px at 960 px): corner between the
      two faces 75.7 deg = BDOT10k vertex 322.9 495.2 (75.6 deg); end of the south face 83 deg = the lighter roof
      strip E 364-372 of the 2024 orthophoto (83.2 deg). The block is therefore the BDOT10k outline west of
      E 372.2 (s18 first drew only the 8 m roof strip, which rendered as a slab facing the camera - rejected by the
      side-by-side). Height: the trailer at the dock (4.0 m) is 155 px against 555 px of wall in the 2.5x crop
      = 14.3 m; from the pixel angle at 72 m 13 m -> 14 m WORKING_VALUE +-1.5 m (the shadow estimate of 19 m is
      dropped). Storeys: dock floor + 3 window rows.
    confidence: medium
    verify: owner photo session (Kuronia 3 from the cycle path); height
    set: {typology: office, wall_material: plaster_grey, ribbon: true, bands: false}
  - id: kuronia3-hall-colour
    target: {building: "bdot:27a0721d-eb46-4021-a0be-dc26db73e398"}
    reason: >-
      Photo P11-001: the low hall behind the office block is clad in the same light grey panels (the hashed pick is
      one of four hall tones). hall_wall_white = the lightest existing hall cladding.
    confidence: medium
    verify: owner photo session (Kuronia 3)
    set: {wall_material: hall_wall_white}
  - id: kuronia2-hall-dark-band
    target: {building: "bdot:941cfc23-bd8b-40d5-a49b-d1bba751d5bd"}
    reason: >-
      Hall at Kuronia 2 (LoD1 2024 12.72 m), the background of photo P11-063 (Rakoon 2024-06-23, from the Mickiewicza
      crossing): light grey cladding with a dark graphite band under the roof edge on the street-corner end (the
      band carries the company lettering, which is not reproduced). Band on the short WSW wall and on the western
      third of the long NNW wall; heights read off the photo proportions (band ~ the upper quarter of the wall),
      WORKING_VALUE.
    confidence: low
    verify: owner photo session (Kuronia / Mickiewicza corner); band extent on the Kuronia side
    # frontage walls cannot use hall_wall_* (runoff UV1 of the hall cladding): plaster_grey = the light grey of the
    # office set; the hall loses the cladding ribs and roof lights of the rule hall (not seen from the street)
    set:
      frontage:
        wall: plaster_grey
        plinth_m: 0.6
        accents:
          - {facing: SW, span: [0.0, 1.0], material: hall_flashing, z: [8.6, 11.8], min_len_m: 20.0}
          - {facing: NW, span: [0.65, 1.0], material: hall_flashing, z: [8.6, 11.8], min_len_m: 20.0}
  - id: rosti-hall-colour
    target: {building: "bdot:2BE4B431-BC59-1BF0-E053-CC2BA8C0D140"}
    reason: >-
      Photo P11-094 (Rakoon, Kuronia looking SW at the north hall of the plant): the hall is clad in light silver
      grey sandwich panels in one colour up to the roof edge (the wall sign is not reproduced). The hashed pick was
      ivory with a red band under the roof. hall_wall_white = the lightest existing hall cladding; hall_bands
      false = no hashed plinth / top band.
    confidence: high
    verify: none
    set: {wall_material: hall_wall_white, hall_bands: false}
  # ---------------------------------------------------------------- P11-063: corner of Mickiewicza / Kuronia
  - id: mickiewicza-kuronia-shrub-band
    kind: plantings
    reason: >-
      Photo P11-063 (CC0, Rakoon 2024-06-23): a closed wall of grown shrubs 2-3 m high fills the strip between the
      east footway of Mickiewicza and the car park of the court; nothing of the car park shows through, the crest is
      a row of rounded bush tops of different height. Orthophoto 2024: dark shrub strip 4-5 m wide from E -58 N 472
      to E -10 N 389 (local), with its shadow on the car park lane; the south end (bearing 92.7 deg from the camera
      of the photo) is N 389-391. ADR 0179 planted two rows of single shrub instances 1.9-2.5 m apart: review s19
      0179 P1 - "separate balls of leaves with gaps, the cars show through". ADR 0186: bush masses instead
      (streetscape.plantings `thicket`: closed leaf shell on a dark core that goes into the ground, no missing
      plants) - two staggered rows of oval masses 5.5-9.5 m long, 2.6-3.6 m wide, 2.0-3.3 m high, every mass
      overlapping its neighbours by 1.2-2.0 m (generated once with a fixed seed, artifacts/dojgreen-0186: the axis
      is traced +-1.5 m, the single bushes are not readable on the orthophoto - sizes WORKING_VALUE, heights against
      the 2.0 m panel fence and the chain posts of the photo +-0.4 m).
    confidence: medium
    verify: owner photo session (Mickiewicza / Kuronia crossing); shrub species
