         [-71.0, -206.0], [-36.0, -240.0], [-112.0, -321.0], [-198.0, -350.0], [-385.0, -336.0], [-450.0, -340.0],
         [-843.0, -455.0], [-1024.0, -500.0]]
      - [[-1024.0, 200.0], [-600.0, 200.0], [-430.0, 214.0], [-260.0, 254.0], [-155.0, 290.0], [-290.0, 405.0],
         [-560.0, 405.0], [-560.0, 300.0], [-780.0, 300.0], [-780.0, 400.0], [-1024.0, 400.0]]
    reason: >-
      Photo P11-056 (Rakoon 2023-08-14, Dywizjonu 303 looking north) and the 2024 orthophoto: the aerodrome
      (BDOT10k OT_KUKO_A "lotnisko lub ladowisko", ring 1 = its outline inside the tile) and the meadow north of
      Dywizjonu 303 up to the allotments (ring 2, traced +-5 m) are open grassland with no trees; the tree line is
      the forest south of the aerodrome and the allotment gardens. The rule self-seeds birches / shrubs on BDOT
      grassland (OT_PTTR_A), which put single trees all over the meadow in the first import (ADR 0174, item 4).
    confidence: medium
