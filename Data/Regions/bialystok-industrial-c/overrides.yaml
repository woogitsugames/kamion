        note: abuts the neighbouring halls bdot:245cc9a8 / bdot:6693a8b5 for most of its length; plain cladding
    annexes:
      - {name: vestibule-1, at: [778638.0, 595753.9], h_m: 3.4, style: accent, door: personnel,
         note: "orthophoto: red roof, 6.1 x 2.6 m"}
      - {name: annex-2, at: [778651.8, 595777.3], h_m: 4.6, style: plain, door: double,
