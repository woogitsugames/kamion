        strips: [{u0_m: 62.0, u1_m: 145.0}]
        office_windows: {u0_m: 4.0, u1_m: 56.0, bay_m: 2.4, w_m: 1.5, h_m: 1.5, sills_m: [1.0, 4.4]}
        doors: [{u_m: 30.0, canopy: true}, {u_m: 104.0, canopy: true}]
        downpipes: [0.6, 24.0, 58.5, 84.0, 110.0, 136.0, 171.0]
        wall_lights: [29.0, 76.0, 104.0, 140.0]
      - name: NW
        at: [778488.4, 595843.7]
        strips: [{u0_m: 6.0, u1_m: 127.0}]
        doors: [{u_m: 20.0}, {u_m: 112.0}]
        drive_doors: [{u_m: 42.0, w_m: 4.0, h_m: 4.5}, {u_m: 94.0, w_m: 4.0, h_m: 4.5}]
        downpipes: [0.6, 27.0, 54.0, 80.0, 107.0, 133.0]
