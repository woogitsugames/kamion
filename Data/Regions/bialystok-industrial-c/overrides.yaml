      Rakoon on Wikimedia Commons, 20210904_101250 and 20241222_122132, reference only): light grey horizontally
      profiled sheet on the SE and SW facades, thin dark coping, vermilion-framed strip of small-pane windows high
      on the SE (yard) facade, vermilion-framed louvre panel on the SW facade next to the south corner, a tall
      vermilion portal further north on the SE facade, red roofs of the two small SE protrusions, dark bitumen roof
      with a staggered grid of small roof lights, a white membrane field behind the SE facade, a lighter lower roof
      inside the inner ring, mushroom roof fans. NOT VISIBLE in any open source (private yard, facade base behind a
      hedge / in shadow): the dock row. WORKING_VALUE: 11 docks on the first SE stretch at exactly the positions of
