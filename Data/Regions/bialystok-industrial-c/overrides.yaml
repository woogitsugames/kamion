    roof:
      skylights: true
      vents: 16
      patches:
        # white membrane field behind the SE facade (orthophoto, +-1 m)
        - {mat: kp_roof_white, ring_epsg2180: [[778638.3, 595759.9], [778661.0, 595802.0], [778647.0, 595809.6], [778624.3, 595767.5]]}
  - id: kwadrat-park-units-forecourt
    kind: paved_area
    material: yard_asphalt
    parking: true
    polygon_epsg2180: [[778664.4, 595680.1], [778725.1, 595792.3], [778709.3, 595800.9], [778648.6, 595688.7]]
    reason: >-
      Forecourt between the yard lane and the row of trade units (bdot:7abd670e): BDOT10k has no paved polygon here,
      so the generator laid grass. The GUGiK orthophoto (2024-05-27) shows a paved strip with cars parked nose-in
      along the units; the CC0 photo 20210904_101250 (Rakoon, Commons) shows asphalt with white stall lines in front
      of the units. Polygon = the units' NW wall line offset 18 m toward the lane (+-1 m); roads and buildings cut it.
    confidence: medium
    verify: owner photo session item 6 (surface, stall layout)
  - id: kwadrat-park-trade-units
    target: {building: "bdot:7abd670e-1a55-4ccb-9da0-9a2ad052ff32"}
    reason: >-
      Row of trade units east of the yard lane. CC0 photo 20210904_101250 (Rakoon, Commons): light grey walls with a
      strip of windows under the eaves, shopfronts, a white end wall. The hashed pick gave ivory sheet. No docks
      (the photo shows shopfronts and parked cars, not ramps).
    confidence: medium
    verify: owner photo session item 6
    set: {typology: hall, wall_material: hall_wall_grey}
  - id: kwadrat-park-gate-kit
    kind: depot_gate
    node: n1882887381
    depot_way: 188397874
    entry_way: 188397866
    exit_way: 194536287
    gate_offset_m: 16.0
    gate_side: left
    fence_return_m: 30.0
    median_min_w: 0.8
    barrier_past_nose_m: 3.0
    replace_radius_m: 25.0
    reason: >-
      OSM maps the Kwadrat Park entrance only as a two-way access road splitting into one-way entry and exit
      lanes, plus one lift_gate node 13 m off the road; no fence, no gatehouse. The 2024-05-27 orthophoto
      (0.25 m) shows a narrow grass median (~2.5 m) between the lanes and a thin line across the eastern
      (entry) lane at the median nose that reads as a boom barrier; no gatehouse or fence line is identifiable.
      Kit: one striped boom per lane housed on the median 3 m past its nose, a gatehouse beside the entry lane,
      a cantilever sliding gate across the two-way road 16 m inside the depot with panel fence returns.
      Everything except the boom position is WORKING_VALUE (typical Polish depot entrance) until photographed.
    confidence: low
    verify: owner photo session item 1 (gate, gatehouse, barrier arms, fence line, which side the gate slides)
