# authored_overrides for bialystok-industrial-c (docs/WORLD_GENERATION.md §Overrides)
#
# Applied by tools/worldgen/roads/build_world.py AFTER the road graph is loaded and BEFORE geometry is
# generated, keyed by stable OSM-derived ids (edge id, osm_way, node id), so they survive every
# regeneration. A target that no longer exists is reported as "stale" in generated/roads_qa.json
# (never silently dropped). Rule (CLAUDE.md §7, skill geo-worldgen): fix the generator when it is wrong;
# use an override only for facts the data does not describe.
schema: truck-sim-pl/overrides/1
overrides:
  - id: kwadrat-park-yard-access-width
    target: {osm_way: [188397874, 1090234585, 1090234575]}
    reason: >-
      Depot access road to the Kwadrat Park yard (route start). OSM has no lanes/width and BDOT10k has no
      matching carriageway, so the generator falls back to class D (2 x 2.50 m = 5.0 m, PTB2022 §17 ust.1).
      The 2024-05-27 orthophoto shows ~7 m of asphalt used by articulated trucks. Set 2 x 3.50 m.
    confidence: medium
    verify: owner photo session item 1 (gate and yard)
    set: {lanes: 2, lane_width: 3.5}
  - id: kwadrat-park-yard-flush-edges
    target: {osm_way: [1090234575]}
    reason: >-
      Inside the paved yard the access road has no raised kerbs (orthophoto: continuous paved surface).
    confidence: medium
    verify: owner photo session item 1
    set: {side_left: flush, side_right: flush}
  - id: kwadrat-park-access-junction-radius
    target: {node: n1882887381}
    reason: >-
      Trucks (16.5 m articulated) turn into the depot access road here; use a 15 m kerb return instead of
      the class default (8 m for class D, standards.CURB_RADIUS). WORKING_VALUE until photographed.
    confidence: low
    verify: owner photo session item 1
    set: {curb_radius: 15.0}
  # ---------------------------------------------------------------- streetscape (tools/worldgen/streetscape)
  - id: kwadrat-park-warehouse
    target: {building: "bdot:9962cca0-95de-4200-a0c4-3922b8e40d9c"}
    reason: >-
      BDOT10k gives FUNKCJA "obiekt handlowo-usługowy", but OSM relation 14517743 maps the same hall as
      building=warehouse "Kwadrat Park" and the 2024-05-27 orthophoto shows semitrailers parked at its
      yard facade (loading docks). Treat it as the hero warehouse: docks on yard-facing facades, dock
      numbering, canopy over the dock row; wall colour not verified.
    confidence: medium
    verify: owner photo session items 1-2 (gate, yard, hall elevations, docks)
    set: {typology: hall, hero: true, docks: true, wall_material: hall_wall_silver, max_docks_per_facade: 18}
  - id: kwadrat-park-hero
    kind: hero_depot
    asset: kwadrat_park
    building: "bdot:9962cca0-95de-4200-a0c4-3922b8e40d9c"
    reason: >-
      Player base (ADR 0071): the main Kwadrat Park hall gets an authored Blender asset
      (art-source/world/landmarks/kwadrat_park, tools/blender/world/landmarks/make_depot.py) instead of the generic
      hall. SEEN (footprint BDOT10k, height LoD1 2024 10.16 m; GUGiK orthophoto 2024-05-27 0.25 m; CC0 photos by
      Rakoon on Wikimedia Commons, 20210904_101250 and 20241222_122132, reference only): light grey horizontally
      profiled sheet on the SE and SW facades, thin dark coping, vermilion-framed strip of small-pane windows high
      on the SE (yard) facade, vermilion-framed louvre panel on the SW facade next to the south corner, a tall
      vermilion portal further north on the SE facade, red roofs of the two small SE protrusions, dark bitumen roof
      with a staggered grid of small roof lights, a white membrane field behind the SE facade, a lighter lower roof
      inside the inner ring, mushroom roof fans. NOT VISIBLE in any open source (private yard, facade base behind a
      hedge / in shadow): the dock row. WORKING_VALUE: 11 docks on the first SE stretch at exactly the positions of
      the previous generic rule (so the yard, the trailers and the route are unchanged), roads.standards dock
      dimensions; doors, drive-in doors, downpipes, wall lights, the office window rows on the SW facade and
      everything on the NW / NE facades are typical for a Polish sandwich-panel logistics hall. The orthophoto shows
      truck rigs parked alongside this stretch, not backed onto it: the dock count is not confirmed by it.
    confidence: medium
    confidence_detail:
      footprint_height: "BDOT10k + LoD1 2024: high"
      cladding_colours_strip_windows_portal: "CC0 photos 2021 / 2024, orthophoto 2024: medium"
      docks_doors_downpipes_lights: "WORKING_VALUE (typical): low"
    verify: owner photo session items 1, 3, 7 (yard facade, dock count and type, doors, portal, strip windows)
    facades:
      # u_m = metres along the facade from its first vertex in counter-clockwise order (the building on the left)
      - name: SE-yard
        at: [778638.9, 595761.0]
        tol_m: 8.0
        # centre_on_len_m = length of the first footprint edge (south corner -> first protrusion): the generic rule
        # centred the row on that edge, the asset keeps it there
        docks: {count: 11, centre_on_len_m: 55.63, first_num: 1, open: {3: 1.0, 8: 0.35}, missing_guides: [6]}
        strips: [{u0_m: 1.5, u1_m: 53.6}, {u0_m: 63.6, u1_m: 78.0}, {u0_m: 93.6, u1_m: 108.2}, {u0_m: 117.6, u1_m: 128.8}]
        doors: [{u_m: 52.4, stairs: true}, {u_m: 70.5}, {u_m: 124.0}]
        drive_doors: [{u_m: 101.0, w_m: 4.0, h_m: 4.5}]
