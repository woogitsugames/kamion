    reason: >-
      OSM maps the Kwadrat Park entrance only as a two-way access road splitting into one-way entry and exit
      lanes, plus one lift_gate node 13 m off the road; no fence, no gatehouse. The 2024-05-27 orthophoto
      (0.25 m) shows a narrow grass median (~2.5 m) between the lanes and a thin line across the eastern
