# authored_overrides for bialystok-industrial-c (docs/WORLD_GENERATION.md §Overrides)
#
# Applied by tools/worldgen/roads/build_world.py AFTER the road graph is loaded and BEFORE geometry is
# generated, keyed by stable OSM-derived ids (edge id, osm_way, node id), so they survive every
# regeneration. A target that no longer exists is reported as "stale" in generated/roads_qa.json
# (never silently dropped). Rule (CLAUDE.md §7, skill geo-worldgen): fix the generator when it is wrong;
# use an override only for facts the data does not describe.
schema: truck-sim-pl/overrides/1
overrides:
  - id: kwadrat-park-yard-access-width
    target: {osm_way: [188397874, 1090234585, 1090234575]}
    reason: >-
      Depot access road to the Kwadrat Park yard (route start). OSM has no lanes/width and BDOT10k has no
      matching carriageway, so the generator falls back to class D (2 x 2.50 m = 5.0 m, PTB2022 §17 ust.1).
      The 2024-05-27 orthophoto shows ~7 m of asphalt used by articulated trucks. Set 2 x 3.50 m.
    confidence: medium
    verify: owner photo session item 1 (gate and yard)
    set: {lanes: 2, lane_width: 3.5}
  - id: kwadrat-park-yard-flush-edges
    target: {osm_way: [1090234575]}
    reason: >-
      Inside the paved yard the access road has no raised kerbs (orthophoto: continuous paved surface).
    confidence: medium
    verify: owner photo session item 1
    set: {side_left: flush, side_right: flush}
  - id: kwadrat-park-access-junction-radius
    target: {node: n1882887381}
    reason: >-
      Trucks (16.5 m articulated) turn into the depot access road here; use a 15 m kerb return instead of
      the class default (8 m for class D, standards.CURB_RADIUS). WORKING_VALUE until photographed.
    confidence: low
    verify: owner photo session item 1
    set: {curb_radius: 15.0}
  # ---------------------------------------------------------------- streetscape (tools/worldgen/streetscape)
  - id: kwadrat-park-warehouse
    target: {building: "bdot:9962cca0-95de-4200-a0c4-3922b8e40d9c"}
    reason: >-
      BDOT10k gives FUNKCJA "obiekt handlowo-usługowy", but OSM relation 14517743 maps the same hall as
      building=warehouse "Kwadrat Park" and the 2024-05-27 orthophoto shows semitrailers parked at its
      yard facade (loading docks). Treat it as the hero warehouse: docks on yard-facing facades, dock
      numbering, canopy over the dock row; wall colour not verified.
    confidence: medium
    verify: owner photo session items 1-2 (gate, yard, hall elevations, docks)
    set: {typology: hall, hero: true, docks: true, wall_material: hall_wall_silver, max_docks_per_facade: 18}
  - id: kwadrat-park-gate-kit
    kind: depot_gate
    node: n1882887381
    depot_way: 188397874
    entry_way: 188397866
    exit_way: 194536287
    gate_offset_m: 16.0
    gate_side: left
    fence_return_m: 30.0
    median_min_w: 0.8
    barrier_past_nose_m: 3.0
    replace_radius_m: 25.0
    reason: >-
      OSM maps the Kwadrat Park entrance only as a two-way access road splitting into one-way entry and exit
      lanes, plus one lift_gate node 13 m off the road; no fence, no gatehouse. The 2024-05-27 orthophoto
      (0.25 m) shows a narrow grass median (~2.5 m) between the lanes and a thin line across the eastern
      (entry) lane at the median nose that reads as a boom barrier; no gatehouse or fence line is identifiable.
      Kit: one striped boom per lane housed on the median 3 m past its nose, a gatehouse beside the entry lane,
      a cantilever sliding gate across the two-way road 16 m inside the depot with panel fence returns.
      Everything except the boom position is WORKING_VALUE (typical Polish depot entrance) until photographed.
    confidence: low
    verify: owner photo session item 1 (gate, gatehouse, barrier arms, fence line, which side the gate slides)
  - id: andersa-viaduct-biezenstwa-style
    kind: bridge_style
    target: {osm_way: [175157461, 177895177]}
    set: {fascia: red, pier_mat: bridge_concrete, noise_screen: null}
    reason: >-
      Andersa viaduct over Rondo Pamięci Bieżeństwa 1915 r.: red-painted deck edge, plain grey cylindrical
      concrete piers, steel railing, no noise screen (CC0 photo 20201102_152339, Rakoon, docs/REFERENCES.md).
      Pier diameter and spacing are not measured (WORKING_VALUE 1.2 m, rule spacing).
    confidence: medium
    verify: pier count / spacing and fascia height from a site photo
  - id: andersa-viaduct-putry-style
    kind: bridge_style
    target: {osm_way: [1101181473, 173956078, 284022563, 606396460]}
    set: {fascia: green, pier_mat: pier_yellow, noise_screen: transparent, screen_h: 3.0}
    reason: >-
      Andersa viaduct at Rondo Putry (DK8/DK19/DK65): green deck edge, yellow-painted round piers in pairs,
      transparent noise screens on posts along the deck (CC0 photo 7204_May_2021, Rakoon; consistent with the
      CC BY-SA photos of Rondo Putry and Andersa/Maczka used as reference only). Screen height WORKING_VALUE.
    confidence: medium
    verify: screen height and post spacing, which deck sides carry screens
  - id: andersa-putry-approach-gantry
    kind: sign_gantry
    osm_way: 266084693
    before_node: n2840742308
    distance_m: 40.0
    boards:
      - lanes: [0, 1]
        rows: [[[E67], Warszawa], [["65"], Ełk]]
      - lanes: [2]
        rows: [[["8", E67], Augustów], [["19"], Kuźnica]]
    reason: >-
      Overhead boards before the split of Andersa (northbound) into the viaduct (Warszawa / Ełk, OSM destination
      on way 1101181473) and the link to Rondo Putry (Augustów / Kuźnica PL/BY, way 606396463). Board texts follow
      the CC0 photo 7204_May_2021 (Rakoon); the exact gantry position is not measured (40 m before the split,
      WORKING_VALUE). Faces are our own schematic drawings, not copies of the real boards.
    confidence: low
    verify: gantry station, lane assignment and board layout from a site photo
  - id: ec-bialystok-chimney-1
    kind: landmark
    osm_way: 628899553
    epsg2180: [778619.25, 595139.04]
    height_m: 120
    base_d_m: 7.5
    top_d_m: 4.5
    reason: >-
      EC Białystok power-plant chimney, 60 m south of the tile edge, visible from Rondo Bieżeństwa and the depot
      (CC BY-SA photo EC_Białystok, reference only). OSM way 628899553: man_made=chimney, height=120,
      colour=red/white, material=concrete; base diameter from the OSM footprint (7.5 m); top diameter and the
      band layout are WORKING_VALUE.
    confidence: medium
    verify: band layout (one of the two chimneys has a chequered top in the reference photo)
  - id: ec-bialystok-chimney-2
    kind: landmark
    osm_way: 628899554
    epsg2180: [778713.26, 595089.71]
    height_m: 120
    base_d_m: 8.3
    top_d_m: 4.8
    reason: >-
      Second EC Białystok chimney (OSM way 628899554: height=120, colour=red/white, material=concrete);
      base diameter from the OSM footprint (8.3 m), top diameter WORKING_VALUE.
    confidence: medium
    verify: as above
  - id: andersa-jrg2-fire-station-hero
    kind: hero_building
    osm_way: 211035271
    buildings: ["bdot:2BE4B431-C784-1BF0-E053-CC2BA8C0D140", "bdot:2BE4B431-C7B4-1BF0-E053-CC2BA8C0D140"]
    asset: fire_station_jrg2
    reason: >-
      Landmark of the start route (ADR 0070): the State Fire Service station JRG nr 2 at Andersa 46 (OSM way
      211035271, amenity=fire_station), 52 m right of the route axis at station 1335 m. The rule facade of the
      BDOT footprints (main building + outbuilding) is replaced by an authored Blender asset
      (art-source/world/landmarks/fire_station_jrg2, tools/blender/world/landmarks/make_fire_station.py): garage
      with four sectional doors between clinker piers, two-storey wing with blue sheet roofs and a hipped tower,
      hall with a segmental barrel roof and the arched gable facing the street, outbuilding with a turret, blue
      steel fence with a sliding gate, thuja row, flag poles. Plan from BDOT10k + orthophoto, heights from GUGiK
      LoD2 (2017), facades by eye from CC0 photos (Commons, Rakoon) and CC BY-SA street-level frames (pattern
      only) - see dims.json. The lettering is the generic name of the service and the emergency number as on the
      facade; no emblem.
    confidence: medium
    verify: yard-side facades, fence line and gate position, thuja count from a site visit
  # ---------------------------------------------------------------- plantings (streetscape.plantings, review r6 W-N12)
  - id: biezenstwa-plantings
    kind: plantings
    reason: >-
      OSM has no barrier=hedge / flowerbed around Rondo Pamięci Bieżeństwa 1915 r. The CC0 photo 20201102_152339
      (Rakoon, docs/REFERENCES.md) shows clipped dark-red berberis hedges on the lawns beside the footpaths and a
      bare soil / mulch bed with red shrubs in the roundabout centre; the GUGiK 2024-05-27 orthophoto (0.25 m) shows
      the same dark shrub masses (traced below, EPSG:2180, +-0.5 m; OSM centrelines overlay the orthophoto within
      1-2 m), the light-brown soil centre island under the viaduct and a paved splitter island between the two zebras
      of the northern arm. Hedge height 0.6-0.8 m, species and the shrub layout in the centre are WORKING_VALUE.
    confidence: medium
    verify: owner photo session (roundabout islands, hedge heights, splitter island surface)
    beds:
      - {name: E1, plant: berberis_red, rim_m: 0.5, ring: [[778575.4, 595530.5], [778577.9, 595529.7], [778580.4, 595527.2], [778582.9, 595523.8], [778585.4, 595519.7], [778586.9, 595515.9], [778586.7, 595513.8], [778584.6, 595514.7], [778581.2, 595517.2], [778577.9, 595519.7], [778575.8, 595522.6], [778575.0, 595526.3]]}
