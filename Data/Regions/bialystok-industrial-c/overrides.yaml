  - id: andersa-viaduct-biezenstwa-hero
    kind: hero_bridge
    target: {osm_way: [175157461, 177895177]}
    asset: viaduct_biezenstwa
    set:
      rail_h_m: 1.10          # ADR 0117: deck-edge railing with horizontal bars in the asset
      rail_inset_m: 0.08
      # ADR 0123 (REVIEW s10-0117 P1-5): pier rows by measurement instead of the 25 m span rule. Mapillary
      # 177786140912399 (richlv, CC BY-SA 4.0, reference only; taken on the ring at its east point): a pier stands on
      # the centre island right behind its kerb, with a W-beam between it and the ring, and the next row is ~35 m
      # further (ratio of the pier heights in the frame ~8) - i.e. a row at each edge of the island (kerb radius
      # 17.3 m on the 0.08 m orthophoto at E 558 N -734) and no row in the middle of the island (the rule had one at
      # the centre and rows 31-33 m out, on the far side of the ring carriageway). Rows 2 and 5 below are those two
      # (14 m either side of the ring centre along the viaduct: columns 2 m inside the island kerb, WORKING_VALUE
      # +-2 m); rows 1, 2 from each end keep the stations the rule gave (not measured: no photo shows them usably).
      # ADR 0144 (REVIEW s14-0123 P1-2, "luka w rzedzie filarow"). Sources checked: OSM (podlaskie-261108.osm.pbf)
      # has no bridge:support near the object, BDOT10k 2061 has no pier geometry, and on the 0.08 m GUGiK orthophoto
      # the decks hide the supports - the only open evidence is the Mapillary frames (richlv, CC BY-SA 4.0,
      # reference only). 2818555625124739 and 3970163613102941 (camera on the ring, looking along the north-west half):
      # FOUR pier rows between the island and the abutment wall - the row on the island and three more at an even
      # rhythm - where the model had three (spans 35.6 / 24.5 / 24.5 m: the 35.6 m span was the gap). Island row ->
      # abutment = 84.7 m on the lead deck (generated open range), so 4 equal spans of 21.2 m; the first span read
      # off 2818555625124739 with the camera pose of sbs_cameras.json is 19.8 m +- 2 m (bearings of the two columns
      # of the near deck in rows 1 and 2), consistent. South-east half: 83.6 m -> 4 x 20.9 m by symmetry of the
      # structure (WORKING_VALUE: no open frame looks along that half). North-west island row unchanged (ADR 0123).
      # r7b check (artifacts/junctions-r7/scripts/cols_check.py): with the columns 1.75 m off the deck axis the outer
      # column of the south-east island row stood ON the island kerb (0.01 m from the ring asphalt). That row is moved
      # 1.5 m towards the ring centre (inside the +-2 m of ADR 0123): main span 26.4 m, south-east spans 4 x 21.3 m.
      pier_lines_en: [[484.54, -686.47], [503.12, -696.62], [521.70, -706.77], [540.3, -716.9], [563.48, -729.59],
                      [582.16, -739.79], [600.83, -749.99], [619.52, -760.20]]
      # ADR 0144 (P2-4): oval piers with the red band on their noses instead of chamfered 0.8 x 1.0 m boxes.
      # 3970163613102941 / 2818555625124739: nose face : side face = 1 : 2.0-2.4 after removing the view angle, i.e.
      # the long axis lies ALONG the bridge; against the pier height of the model (4.3 m) the nearest pier measures
      # about 0.5-0.75 m across and 1.1-1.6 m along -> 0.70 x 1.40 m (WORKING_VALUE +-0.2 m). Columns of one deck
      # stand 3.8 m apart on 178689077481862 (two rays to their feet), 3.6-5.4 m on 2818555625124739 -> 1.75 m either
      # side of the deck axis (was 1.30 m; WORKING_VALUE +-0.4 m), which keeps them under the box girder (bottom
      # flange half width 2.0 m).
      col_shape: stadium
      col_len_m: 1.40
      col_wid_m: 0.70
      col_offset_m: 1.75
    reason: >-
      Landmark object of route G3-A (ADR 0067): the Andersa viaduct over Rondo Pamięci Bieżeństwa 1915 r. gets an
      authored Blender asset (art-source/world/landmarks/viaduct_biezenstwa, tools/blender/world/landmarks/
