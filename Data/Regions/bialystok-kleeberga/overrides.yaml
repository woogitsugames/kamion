      (terrain_lod2) hung 0.27-4 m above the DK8 road collision at both arcs (probe_lod2.py) - the D64 truck route
      was blocked. The two ring arcs that cross the cutting (25 m each of their 35 m inside the 7 m buffer of the
      DK8 axes) are carried as decks: the profile solver then holds them at the road below + clearance and does not
      conform the terrain under them. Orthophoto 2024: ring and island over the cutting, portals in shadow at both
      arcs (junctions/j5_interchange_773800.jpg).
    confidence: high
    verify: probe_lod2.py after the rebuild (no terrain or deck lower than 4.5 m above the DK8 road collision)
    set: {bridge: true}
