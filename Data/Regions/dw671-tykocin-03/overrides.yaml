    target: {osm_way: [145989268]}
    source: "continuation of dw671-tykocin-01 dw671-ground-shoulder along the same OSM way (ADR 0272); not measured here"
    reason: >-
      Seam continuity (tests/gis/test_ring_0231.py: same cross-section set on both sides of every seam): the way is
      one road through dw671-tykocin-01 / -02 / -03; the rule profile (kerbed street, OSM maxspeed missing) would
      switch the shoulder family on the tile edge.
