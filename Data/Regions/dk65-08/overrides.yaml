    target: {osm_way: [1111506750, 1111506754, 27718745, 286990127, 286990128, 305910042]}
    reason: >-
      DK65 single carriageway. BDOT10k gives 6.0 m (or nothing), the generator drew 2 x 3.0 m. GUGiK orthophoto
      0.1 m of 2025-05-27, cross profiles averaged over 6-10 m at four stations (EPSG:2180 760751 611837;
      760683 611909; 761079 611483; 761559 610967; tool artifacts/knyszyn-0204/profile10.py): edge line to edge
      line 6.8 m (lanes 3.3-3.5 m), asphalt 7.3-7.6 m, then a pale shoulder. Set 2 x 3.4 m + 0.35 m edge strips
      = 7.5 m (+-0.3 m).
      ADR 0212: solid edge lines P-7b on both sides (edge_lines: both). Orthophoto 0.1 m 2025, integrated brightness
      excess across DK65 at 12 stations of ways 305910042 / 27718745 / 1111506754 / 286990127: peaks 3.0-4.0 m left
      and right of the OSM axis, median ~3.6 m (generator: axis 0.20 m inside the 7.5 m edge = 3.55 m; 0.12 m wide,
      pkt 2.2.2). The bus bay at 762500 609950 has a broken edge line on the orthophoto - painted solid here (open).
      Same set in knyszyn and knyszyn-w (seams consistent).
    confidence: high
    verify: none
    set: {lanes: 2, lane_width: 3.4, edge_strip: 0.35, edge_lines: both}
  - id: rural-roads-unlit
    target: {osm_way: [27718745, 98071886, 286990127, 286990128, 305910042, 1111506750, 1111506754]}
    reason: >-
      DK65 and the field road of this tile run through fields and pine woods with no street lighting: owner frames
      of DK65 (2026-07-27/28, 10 frames) show no lamp columns outside the town, and the 0.1 m orthophoto of 2025
      shows no columns or their shadows on the verges. The lamp rule lights every road of class GP/G/Z (122 columns
      here). OSM has no `lit` tag on these ways.
    confidence: high
    verify: none
    set: {lamps: false}
