  - id: dk65-obozowa-south-unlit-0216
    target: {osm_way: [286990127]}
    sources: ["artifacts/summer-led-0216/ortho/knyszyn_w286990127_f030.jpg", "artifacts/summer-led-0216/ortho/knyszyn_w286990127_f080.jpg",
              "research/dk65-knyszyn-refs/README.md (e)"]
    reason: >-
      DK65 (Obozowa) south of the town, 528 m across fields (2.7 buildings per 100 m within 60 m): GUGiK orthophoto
      0.1 m of 2025-05-27, two 120 m crops (EPSG:2180 760878 611699 and 760698 611892) show road signs but no lamp
