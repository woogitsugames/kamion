# Authored overrides of region knyszyn-w (ADR 0209). Every entry survives a re-import; coordinates are
# region-local E/N (origin EPSG:2180 759563, 612607) or EPSG:2180 where the key says so. Sources: GUGiK orthophoto
# 0.1 m 2025 (Data/raw/gugik/gugik-orto-2025-rgb-0p10-knyszyn-w), BDOT10k 2008, LoD1 2024. No lettering, no brands.
overrides:
  - id: dk65-carriageway-width
    target: {osm_way: [232511646, 232511647]}
    reason: >-
      DK65 Obozowa from the DK65/DW671 roundabout (east seam with tile knyszyn, x = 760587) north-west to the north
      tile edge (towards Monki). BDOT10k gives 5.6-6.0 m. GUGiK orthophoto 0.1 m 2025, cross profiles averaged over
      6 m (artifacts/knyszyn-w-0209/tools/profile10.py) at EPSG:2180 760480 612300 and 759650 613425: edge line to
      edge line 6.8 m (both stations), pale paved strip incl. shoulder 8.4-10.4 m. Same cross-section as the
      measured override of the knyszyn tile (ADR 0204: 2 x 3.4 m + 0.35 m edge strips = 7.5 m, +-0.3 m), so the
      seam at the roundabout arm keeps one width.
      ADR 0212: solid edge lines P-7b on both sides (edge_lines: both). Orthophoto 0.1 m 2025, integrated brightness
      excess across DK65 at 8 stations of way 232511647: peaks 3.3-3.95 m left and right of the OSM axis, median
      ~3.55 m = the generator's axis 0.20 m inside the 7.5 m carriageway edge; 0.12 m wide (DK65 is no dual
      carriageway / international route, pkt 2.2.2). Same set in knyszyn and knyszyn-s (seams consistent).
    confidence: high
    verify: none
    set: {lanes: 2, lane_width: 3.4, edge_strip: 0.35, edge_lines: both}
  # ADR 0304: line-to-line distance of the edge lines measured at the tile seams (GUGiK orthophoto WMS
  # HighResolution 0.1 m, qa/seam_line_ortho.py, artifacts/seams-p3-s24/ortho). Separate entry so the cross-section
  # set of `dk65-carriageway-width` (ADR 0212 test) stays the same in every tile.
  - id: dk65-edge-line-spacing-0304
    target: {osm_way: [232511646, 232511647]}
    reason: >-
      Edge lines P-7b of DK65 6.75-6.8 m apart axis to axis (medians of 40-79 cross profiles every 0.5 m, +-40 m
      around the seams knyszyn | knyszyn-w (way 232511646) and knyszyn-w | dk65-monki-01 (way 232511647);
      knyszyn-s | knyszyn 6.75 / 6.8, knyszyn | knyszyn-w 6.75 / 6.75, knyszyn-w | dk65-monki-01
      6.75 / 6.75). ADR 0204 / 0212 read 6.8 m at the stations of way 305910042. The generator painted them 0.20 m inside
      the 7.5 m carriageway edge = 7.1 m (ADR 0212 WORKING_VALUE, +0.3 m). Same entry in knyszyn, knyszyn-w,
      knyszyn-s (not way 27718745: its width profile 6.6 -> 7.5 m keeps the 0.20 m inset, 6.2 m measured on the narrow
      part) and dk65-monki-01.
    source: "GUGiK orthophoto 0.1 m 2025 (WMS HighResolution), ADR 0304"
    confidence: medium
    verify: owner drive / owner photo with a tape across the road
    set: {edge_line_spacing: 6.8}
