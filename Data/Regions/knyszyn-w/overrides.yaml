              "research/night-lamps-s21/README.md section 4"]
    reason: >-
      Owner D65 p.8: street lighting on the DK65 / Knyszyn route is white LED. The older side-street poles
      (spun concrete with an arc arm, thin grey steel) keep their shape and positions and carry a flat LED head
      instead of the sodium one (ADR 0216). Nominal 4000 K: ZDM Bialystok tenders 2023-2024 (K69, SOURCED for
