  # ADR 0237 D38 (world3, leader s23): the same sidewalk rule as tile knyszyn (`knyszyn-pavement-rules-d38`), so the
  # western streets of the town (Jagiełły, Kościelna, Legionowa, Tykocka, Zamoyskiego, Junga, Chwalczewskiego, Polna)
  # and the seam with knyszyn (x = 760587) keep one cross-section family.
  - id: knyszyn-w-pavement-rules-d38
    kind: pavement_rules
    implied_sidewalks: true
    sidewalk_bdot: false
    estate_slabs: false
    crossing_kerb_drops: true
    reason: >-
      Owner (s23, docs/owner/KNYSZYN-OWNER-FEEDBACK-S21.md): sidewalks on both sides of every street of Knyszyn,
      concrete block paving. The graph of this tile carries no sidewalk=* tag on any of its 47 edges, so without the
      rule the town streets west of the tile seam got grass behind both kerbs. implied_sidewalks lays a 2.0 m sidewalk
      (roads.standards.SIDEWALK_W) behind both kerbs of residential / tertiary / secondary / unclassified paved streets
      in the built-up area (BDOT10k residential zabudowa + 60 m: 25 jednorodzinna + 1 wielorodzinna polygons in this
      tile) unless OSM says sidewalk=no / separate or a mapped path runs within 6 m of the kerb. DK65 Obozowa is
      highway=primary and stays outside the rule (as in tile knyszyn). Surface: grey 20 x 10 blocks (default). Widths
      not measured: WORKING_VALUE.
    confidence: medium
    verify: owner check of Jagiełły / Kościelna; widths on the GUGiK orthophoto 0.1 m 2025 of this tile
