# Authored overrides of region dw671-tykocin-01 (ADR 0212). Every entry survives a re-import; coordinates are
# region-local E/N (origin EPSG:2180 759563, 610559) or EPSG:2180 where the key says so. Sources: GUGiK orthophoto
# 0.1 m 2025 (Data/raw/gugik/gugik-orto-2025-rgb-0p10-dw671-tykocin-01), BDOT10k 2008, LoD1 2024. No lettering, no brands.
# Rough version (D63): DW671 keeps the BDOT10k width (6.5-7.0 m, as in knyszyn-w where the same way 70329870 has no
# override) and no edge lines: the orthophoto shows the dashed centre line and no consistent edge line (integrated
# brightness excess at 25 stations of ways 70329870 / 286989055 / 145989268: edge/centre ratio mostly < 0.5).
overrides:
  - id: tertiary-west-unlit
    target: {osm_way: [98072327]}
    reason: >-
      Tertiary road west from the DW671 village across the fields (orange in artifacts/knyszyn-edges-0212/view/
      tyk_all.jpg): no lamp columns on the 2025 orthophoto at 2 m overview; not checked at 0.1 m (open).
    confidence: low
    verify: none
    set: {lamps: false}
  # ADR 0217 (FIX 4): level crossing of DW671 with line 38. OSM node 1778182481 has no crossing:barrier / crossing:light,
  # so the rule would build an unprotected crossing with G-3 crosses. Authored from open sources (no Google):
  - id: rail-crossing-dw671-line38
    kind: rail_crossing
    target: {osm_node: 1778182481}
    reason: >-
      GUGiK orthophoto 2025 0.1 m (artifacts/rail-fix-s21/ref/ortho_0p10_crossing_60m.jpg): on the right of each
      approach an orange drive cabinet and posts with long thin shadows, a second device on the left of each approach,
      guard rails along both road edges, crossing panels running ~1.5-2 m past the edge lines. Mapillary
      1569863873404925 (2020-06-23) and 828893548045009 (2019-07-03), CC BY-SA, both looking north-east from the
      south-west approach: raised red-white booms on orange drives on the right AND on the left, a mast with two red
      lamps on round black backboards on each side, no St Andrew's cross on the masts.
    sources: [gugik-orto-2025-rgb-0p10-dw671-tykocin-01, "mapillary:1569863873404925", "mapillary:828893548045009"]
    confidence: medium
    verify: >-
      photos are 2019-2020, the orthophoto 2025 shows the same four device positions; the north-east approach is
      read from the orthophoto only. Open: guard rails and the red transverse strips before the crossing are not built.
    set: {barrier: double_half, light: true, light_left: true, panel_margin_m: 1.5}
