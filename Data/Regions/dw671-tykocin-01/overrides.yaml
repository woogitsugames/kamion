  # ADR 0272 (REVIEW s22-0217 P1-4): DW671 south-west of the village has no kerbs. GUGiK orthophoto WMS StandardResolution
  # (sheet date / native resolution UNVERIFIED), 11 clean cross-sections of ways 145989268 / 286989055
  # (docs/reports/ortho-xsec-0272/dw671-tykocin-01_dw671.json): asphalt 6.15-7.25 m (median 6.85; BDOT10k 6.5 / 7.0
  # kept); read by eye on the strips: grass / ground right at the asphalt edge on both sides, no kerb, no gully, thin
  # edge lines (both detected at 2 sections, 6.85-6.9 m apart at the crossing), no cut ditch -> shallow swale
