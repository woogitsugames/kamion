# Authored overrides of region knyszyn-s (ADR 0204). Every entry survives a re-import; coordinates are
# region-local E/N (origin EPSG:2180 761611, 610559) or EPSG:2180 where the key says so. Sources: GUGiK orthophoto
# 2024 0.25 m (Data/raw/derived/knyszyn-s/ortho_0p25m.tif), BDOT10k 2008, LoD1 2024. No lettering, no brands.
overrides:
  - id: dk65-carriageway-width
    target: {osm_way: [1111506750, 1111506754, 27718745, 286990127, 286990128, 305910042]}
    reason: >-
      DK65 single carriageway. BDOT10k gives 6.0 m (or nothing), the generator drew 2 x 3.0 m. GUGiK orthophoto
      0.1 m of 2025-05-27, cross profiles averaged over 6-10 m at four stations (EPSG:2180 760751 611837;
      760683 611909; 761079 611483; 761559 610967; tool artifacts/knyszyn-0204/profile10.py): edge line to edge
      line 6.8 m (lanes 3.3-3.5 m), asphalt 7.3-7.6 m, then a pale shoulder. Set 2 x 3.4 m + 0.35 m edge strips
      = 7.5 m (+-0.3 m).
      ADR 0212: solid edge lines P-7b on both sides (edge_lines: both). Orthophoto 0.1 m 2025, integrated brightness
      excess across DK65 at 12 stations of ways 305910042 / 27718745 / 1111506754 / 286990127: peaks 3.0-4.0 m left
      and right of the OSM axis, median ~3.6 m (generator: axis 0.20 m inside the 7.5 m edge = 3.55 m; 0.12 m wide,
      pkt 2.2.2). The bus bay at 762500 609950 has a broken edge line on the orthophoto - painted solid here (open).
      Same set in knyszyn and knyszyn-w (seams consistent).
    confidence: high
    verify: none
    set: {lanes: 2, lane_width: 3.4, edge_strip: 0.35, edge_lines: both}
  # ADR 0304: line-to-line distance of the edge lines measured at the tile seams (GUGiK orthophoto WMS
  # HighResolution 0.1 m, qa/seam_line_ortho.py, artifacts/seams-p3-s24/ortho). Separate entry so the cross-section
  # set of `dk65-carriageway-width` (ADR 0212 test) stays the same in every tile.
  - id: dk65-edge-line-spacing-0304
    target: {osm_way: [1111506750, 1111506754, 286990127, 286990128, 305910042]}
    reason: >-
      Edge lines P-7b of DK65 6.75-6.8 m apart axis to axis (medians of 40-79 cross profiles every 0.5 m, +-40 m
      around the seam knyszyn-s | knyszyn (way 286990127);
      knyszyn-s | knyszyn 6.75 / 6.8, knyszyn | knyszyn-w 6.75 / 6.75, knyszyn-w | dk65-monki-01
      6.75 / 6.75). ADR 0204 / 0212 read 6.8 m at the stations of way 305910042. The generator painted them 0.20 m inside
      the 7.5 m carriageway edge = 7.1 m (ADR 0212 WORKING_VALUE, +0.3 m). Same entry in knyszyn, knyszyn-w,
      knyszyn-s (not way 27718745: its width profile 6.6 -> 7.5 m keeps the 0.20 m inset, 6.2 m measured on the narrow
      part) and dk65-monki-01.
    source: "GUGiK orthophoto 0.1 m 2025 (WMS HighResolution), ADR 0304"
    confidence: medium
    verify: owner drive / owner photo with a tape across the road
    set: {edge_line_spacing: 6.8}
  # ADR 0233 (dk65-r4-s21): the east 484 m of DK65 in this tile (seam with dk65-11, x = 762635, route km 24.83, up to the
  # repaving joint at km 25.32) still has the corridor section of research K1 - edge lines 6.2 m apart - and only then
  # widens to the section of `dk65-carriageway-width` above. Must stay AFTER that entry (it refines the same edge);
  # the first two stops of `width` are the `dk65-xsec-k1` section of dk65-06..11 (2 x 3.1 + 2 x 0.2 = 6.6 m), so both
  # sides of the seam build the same road (tests/gis/test_dk65_seam_knyszyn_0233.py).
  - id: dk65-k1-section-to-km25.32
    target: {edge: "w27718745:897574813-1134817563"}
    reason: >-
      GUGiK orthophoto WMS HighResolution 0.1 m (sheets 2025-05-25/27), straightened strip along the OSM axis from
      km 24.05 to 26.15, edge-line pair per 10 m block (artifacts/dk65-r4-s21/tools/seam_strip.py, 100 m medians):
      6.0 m (km 24.05-24.65), 6.2 m (km 24.65-25.31, this tile from km 24.83), then at a repaving joint 862-874 m
      past the dk65-10/11 seam (484-496 m into this edge, km 25.31-25.32) the carriageway widens: broken edge lines
      7.1-7.5 m apart to km 25.49, solid lines 6.7-6.8 m apart beyond (the section measured by ADR 0204 / 0212).
      K1 (research/dk65-knyszyn-refs) reads 6.1 m at km 25.0 and 6.8 m at km 26.0. The entry keeps 7.5 m as the widest
      value and narrows the first 484 m to 6.6 m (generator: line 0.20 m inside the edge -> 6.2 m line to line);
      `lanes_follow_width` lets the two lanes share the local width, so the centre line stays on the axis and the
      lane centres sit at +-1.55 m like in dk65-11. Transition over 12 m (+ the 15 m width smoothing).
    confidence: medium
    verify: owner drive - where the road widens south of the S16 site; broken edge lines km 25.32-25.49 painted solid here
    set: {edge_strip: 0.2, lanes_follow_width: true, width: [[0.0, 6.6], [0.586, 6.6], [0.601, 7.5], [1.0, 7.5]]}
