      # (820,150) (890,700) (935,1400) (935,1950), 3.5 m (N end) to 12-18 m (S end) from the asphalt edge.
      - line_epsg2180: [[768272.0, 601665.0], [768279.0, 601610.0], [768283.5, 601540.0], [768283.5, 601485.0]]
        spacing_m: [13.0, 17.0]
        missing_share: 0.08
      # East: single trees in a loose line, px (1125,600) (1160,1230) (1235,1520) (1290,1880), 8-13 m from the edge.
      - line_epsg2180: [[768302.5, 601620.0], [768306.0, 601557.0], [768313.5, 601528.0], [768319.0, 601492.0]]
        spacing_m: [18.0, 30.0]
