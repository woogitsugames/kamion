  - id: dk65-xsec-k1
    target: {osm_way: [208187096, 27718745, 1151531610]}
    reason: >-
      Old DK65 between the Dobrzyniewo roundabout and dk65-11. K1: painted edge lines 6.0-6.4 m apart (median 6.2 m);
      the in-tile reading of ADR 0214 on the 0.25 m orthophoto 2024 gave 6.25-6.75 m and asphalt 7.1-7.5 m. Class G:
      the generator paints the 0.12 m edge line 0.20 m inside the carriageway edge and adds a 1.0 m paved shoulder
