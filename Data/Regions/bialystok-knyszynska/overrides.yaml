  # ADR 0272: the class G rule (ground shoulder, asphalt = width + 2 x 0.08 m) would narrow Szosa Ełcka here from 8.5 to
  # 6.66 m. GUGiK orthophoto WMS, 5 sections of way 303739903 (2026-11-15): asphalt about 9 m at the one section clear of
  # lay-bys and junction mouths (s 175), 11-14 m at the others, no edge lines - the paved-shoulder profile is the closer
  # one. Kept as it was until the cross-section is measured properly (width 6.5 m + 2 x 1.0 m, WORKING_VALUE).
  - id: szosa-elcka-keep-paved-shoulder
    target: {osm_way: [303739903]}
    source: "GUGiK orthophoto WMS, measured 2026-11-15 (ADR 0272)"
    reason: >-
      Keeps the cross-section this tile had before ADR 0272: paved shoulder 1.0 m + ground part 0.75 m. The orthophoto
      shows asphalt wider than the carriageway width (about 9 m), not a ground shoulder at the lane edge.
    confidence: low
