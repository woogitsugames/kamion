# Route links of the streamed world (stream-gaps-s23): authored driving paths that continue the route autopilot across
# tiles whose own control route (route_start.json, ADR 0203-0214) does not end on the seam towards the next tile.
# Each link lies inside ONE tile; its lane polyline is computed by tools/worldgen/streaming/route_links.py with the same
# code as scripts/export-route.py (effective graph -> networkx shortest path -> roads.route.lane_route).
# Runtime: WorldStreamer.ContinueRoute appends a link when its first point meets the autopilot path end (<= routeJoinM)
# and its tile is Ready; links of destination != the chosen one (launch argument `-route_to`, default tykocin) are skipped;
# a link with replaces_route is appended INSTEAD of that tile's start route (same first point).
# These are NOT authored_overrides of the region (route_endpoints.json / overrides.yaml stay untouched): spawn, cameras and
# the region catalog keep using each tile's own start route.
schema: truck-sim-pl/route-links/1
links:
  - id: c-dk8-to-maczka
    tile: bialystok-industrial-c
    destination: any            # every trip out of C: the C start route ends on DK8/DK19 ~700 m before the Maczka seam
    after_route: bialystok-industrial-c   # starts at the end of this tile's start route
    end_epsg2180: [776971.0, 596279.2]    # Maczka route entry on the C | Maczka seam (Data/Regions/bialystok-maczka/route_endpoints.json)
    tail_to: route:bialystok-maczka       # last BLEND_M m shifted onto the Maczka route start (lane offset of the next tile)
    note: "C start route end (DK8/DK19) -> DK8 Maczka westbound to the seam with bialystok-maczka"
  # The knyszyn control route ends at Rynek, a dead end for the corridor (the next road out is behind the truck: a U-turn
  # of the articulated vehicle). For a trip through Knyszyn the link REPLACES that route: same entry (seam with
  # knyszyn-s), same DK65 approach, then the roundabout DK65/DW671 and the exit arm of the destination.
  - id: knyszyn-dk65-to-dw671-w
    tile: knyszyn
    destination: tykocin
    replaces_route: knyszyn               # starts at the knyszyn route start (seam knyszyn-s | knyszyn, 760985.8, 611583)
    end_epsg2180: [760587.0, 611964.5]    # DW671 Tykocka on the knyszyn | knyszyn-w seam (graph boundary node of way 1478765548, both tiles)
    note: "DK65 Obozowa from knyszyn-s -> roundabout DK65/DW671 -> DW671 Tykocka west to the seam with knyszyn-w"
  - id: knyszyn-dk65-to-dk65-w
    tile: knyszyn
    destination: monki
    replaces_route: knyszyn
    end_epsg2180: [760587.0, 612073.7]    # DK65 Obozowa on the knyszyn | knyszyn-w seam = knyszyn-w route entry (ADR 0209)
    tail_to: route:knyszyn-w
    note: "DK65 Obozowa from knyszyn-s -> roundabout DK65/DW671 -> DK65 west to the seam with knyszyn-w (towards Monki)"
  # seams-fix-s23: a drive STARTED in knyszyn (`-scene knyszyn`) has the control route as its path, which ends at Rynek;
  # nothing joined there, so the autopilot stopped. These links continue from the route end without turning round
  # (route_links.py drops the edge back to the node the route came from): round Rynek -> Grodzienska -> Tykocka west ->
  # roundabout split -> the exit arm of the destination, ending on the same seam points as the links above.
  - id: knyszyn-rynek-to-dw671-w
    tile: knyszyn
    destination: tykocin
    after_route: knyszyn                  # starts at the end of the knyszyn control route (Rynek, graph node n2979322319)
    end_epsg2180: [760587.0, 611964.5]    # = end of knyszyn-dk65-to-dw671-w (DW671 Tykocka, knyszyn | knyszyn-w seam)
    note: "Rynek (end of the knyszyn control route) -> Grodzienska -> DW671 Tykocka west -> seam with knyszyn-w"
  - id: knyszyn-rynek-to-dk65-w
    tile: knyszyn
    destination: monki
    after_route: knyszyn
    end_epsg2180: [760587.0, 612073.7]    # = end of knyszyn-dk65-to-dk65-w = knyszyn-w route entry (ADR 0209)
    tail_to: route:knyszyn-w
    # knyszyn-r24 (ADR 0289 'Recenzja s24'): the right turn Tykocka -> DK65 W on the compact roundabout follows the right
    # lane centre through a ~7 m corner and the semitrailer cut the kerb corner between the arms (15 tyre points off the
    # hard surface at s 696-702 m, qa/link_swept_check.py). Swing wide into the ring: 3.0 m left at the ring apex,
    # raised cosine over +-30 m -> 0 tyre points off the hard surface and 0 off the carriageway (asphalt only).
    # Searched 680-692 m x 1.0-3.0 m x 15-35 m; 2.5 m / 35 m leaves 7 points on kerb / apron (WORKING_VALUE).
    swing:
      - {near_epsg2180: [760625.1, 612005.4], left_m: 3.0, half_m: 30.0}
    note: "Rynek (end of the knyszyn control route) -> Grodzienska -> Tykocka -> roundabout split -> DK65 west to the seam"
  - id: knyszyn-w-dw671
    tile: knyszyn-w
    destination: tykocin
    start_epsg2180: [760587.0, 611964.5]  # boundary node of way 1478765548 (east edge)
    end_epsg2180: [760129.2, 611583.0]    # boundary node of way 70329870 (south edge) = dw671-tykocin-01 route entry (ADR 0212)
    head_from: link:knyszyn-dk65-to-dw671-w   # first BLEND_M m shifted from the end of that link (knyszyn lanes still
                                              # tapered by the roundabout 37 m before the seam; knyszyn-w lanes are not)
    tail_to: route:dw671-tykocin-01
    note: "DW671 Tykocka across the south-east corner of knyszyn-w to the seam with dw671-tykocin-01"
  # D81 (owner, s23): truck route C <-> Dojlidy over DK19 (Andersa -> Sosabowskiego -> Piastowska -> pl. Antonowicza ->
  # Branickiego -> rondo Meyera -> Ciolkowskiego). The C control route runs west to Maczka; for the trip to Dojlidy the
  # link REPLACES it: same first node (identical first lane points), rondo Pamieci Biezenstwa, Andersa south to the seam
  # with bialystok-wygoda (ADR 0278 tile 5). Launch: -route_to dojlidy.
  - id: c-andersa-to-wygoda
    tile: bialystok-industrial-c
    destination: dojlidy
    replaces_route: bialystok-industrial-c
    end_epsg2180: [779019.0, 595242.45]   # Andersa southbound boundary node on the C | wygoda seam (wygoda route entry)
    tail_to: route:bialystok-wygoda
    # dk19-tiles-s24 (after knyszyn-r24 swept-path gate, qa/link_swept_check.py): following the right lane centre the
    # semitrailer cut the inside of the turn at s 363-370 m (14 tyre points off the hard surface). Swing wide: 2.0 m left
    # at s 364 m, raised cosine over +-30 m -> 0 off the hard surface, 0 off the carriageway. Searched apex s 340-372 m
    # (step 8) x 1.0-3.0 m x 20/30 m: at s 364 m / 30 m every offset 1.0-3.0 m gives 0/0 (WORKING_VALUE, middle picked).
    swing:
      - {near_epsg2180: [778546.8, 595529.6], left_m: 2.0, half_m: 30.0}
    note: "C route start -> rondo Pamieci Biezenstwa 1915 -> Andersa (DK19/DK65) south-east to the seam with bialystok-wygoda"
  # The 91 m wygoda route ends 2.72 m off the bojary route entry (lane centre of the 2-lane Andersa end vs the first lane
  # of Sosabowskiego in bojary): the link shifts its last BLEND_M m onto the bojary entry instead of a sideways step.
  - id: wygoda-andersa-to-bojary
    tile: bialystok-wygoda
    destination: dojlidy
    replaces_route: bialystok-wygoda
    end_epsg2180: [779098.27, 595199.0]   # graph boundary node on the wygoda | bojary seam (bojary route entry)
    tail_to: route:bialystok-bojary
    note: "Andersa / Sosabowskiego across the south-west corner of wygoda to the seam with bialystok-bojary"
  # ADR 0288 (owner D82): the loop S8 <-> DW671 <-> Tykocin. The S8 westbound carriageway (way 305447699) only cuts the
  # south-west corner of dk65-01: it enters from the south seam (tile dk8-s8-jeroniki, ADR 0278 - defined, not built)
  # and leaves on the west seam = the s8-01 route entry. In the directed graph of dk65-01 that seam node is reachable
  # ONLY from the south seam node (the on-ramps of the junction Bialystok Zachod towards Warsaw lie in dk8-s8-jeroniki),
  # so a link from the dk65-01 control route is not possible inside this tile; the dk65-01 route stays untouched.
  # Missing for a continuous trip Bialystok -> S8: dk8-s8-jeroniki built + two links (dk65-01 -> south seam, jeroniki).
  # ADR 0292 (agent dk8-s8-s24): the trip Bialystok -> S8 towards Warsaw. In the directed graphs the S8 westbound
  # carriageway (way 305447699) at the jeroniki | dk65-01 seam is reachable ONLY from the DK8 westbound carriageway on the
  # jeroniki | bialystok-porosly seam (way 889307875): Warszawska (dk65-01 -> jeroniki) has no on-ramp to DK8 westbound,
  # and the other graph paths use the median crossover ways 1571341511/1571341512 (access=no). The truck route is DK8
  # Kleeberga south from the rondo Kresowian (bialystok-knyszynska) -> bialystok-porosly -> junction Bialystok Zachod in
  # dk8-s8-jeroniki -> S8 across the dk65-01 corner -> s8-01. Each link lies in one tile (the control routes of
  # knyszynska / porosly / jeroniki all run INTO the city, ADR 0208 / 0278).
  - id: knyszynska-kleeberga-s
    tile: bialystok-knyszynska
    destination: s8
    replaces_route: bialystok-knyszynska  # same entry: Kleeberga westbound on the seam with bialystok-kleeberga
    end_epsg2180: [772286.3, 595199.0]    # Kleeberga southbound (way 606396500, DK8) on the knyszynska | porosly seam
    head_from: route:bialystok-kleeberga  # the kleeberga route ends 0.86 m to the side of this link's lane start
    note: "Kleeberga (DK8) straight on past the rondo Kresowian exit, south to the seam with bialystok-porosly"
  - id: porosly-dk8-w
    tile: bialystok-porosly
    destination: s8
    start_epsg2180: [772286.3, 595199.0]  # boundary node of way 606396500 (north edge)
    end_epsg2180: [770827.0, 594847.7]    # boundary node of way 889307875 (west edge, DK8 westbound, seam with jeroniki)
    head_from: link:knyszynska-kleeberga-s   # lanes 0.65 m apart on the knyszynska | porosly seam
    note: "DK8 Kleeberga south-west through Porosly to the seam with dk8-s8-jeroniki"
  - id: jeroniki-dk8-to-s8
    tile: dk8-s8-jeroniki
    destination: s8
    start_epsg2180: [770827.0, 594847.7]  # boundary node of way 889307875 (east edge)
    end_epsg2180: [769340.8, 595199.0]    # boundary node of way 305447699 (north edge) = start of dk65-01-s8-corner
    note: "DK8 westbound through the junction Bialystok Zachod onto the S8 towards Warsaw, to the seam with dk65-01"
  - id: dk65-01-s8-corner
    tile: dk65-01
    destination: s8
    start_epsg2180: [769340.8, 595199.0]  # boundary node of way 305447699 (south edge, seam with dk8-s8-jeroniki)
    end_epsg2180: [768779.0, 595332.7]    # boundary node of way 305447699 (west edge) = s8-01 route entry
    tail_to: route:s8-01
    note: "S8 westbound across the south-west corner of dk65-01 to the seam with s8-01"
  # ADR 0288: the cross-section of way 536205568 is the same on both sides of the s8-03 | s8-04 seam (3 x 3.50 m,
  # qa.seams), but the two control routes sit one lane apart there (3.5 m: s8-03 ends in the rightmost of 3 lanes after
  # the junction Tykocin, s8-04 starts one lane to the left). The link replaces the s8-03 route with the same path and
  # shifts its last BLEND_M m onto the s8-04 route start, so the autopilot path has no lateral step on the seam.
  - id: s8-03-to-s8-04
    tile: s8-03
    destination: s8
    replaces_route: s8-03
    end_epsg2180: [762635.0, 596015.9]    # S8 westbound on the s8-03 | s8-04 seam = s8-04 route entry
    tail_to: route:s8-04
    note: "S8 westbound through the junction Tykocin, lane shift before the seam with s8-04"
  # ADR 0303: the trip "Tykocin" ends on the Rynek (Plac Stefana Czarnieckiego), not on the south edge of the tile. The
  # tykocin control route (cameras / QA) runs on through the town to the tile edge; for the trip this link REPLACES it:
  # same entry (seam with dw671-tykocin-09), DW671 Puchalskiego over the Narew bridge, round the SE corner of the square
  # onto its south side (DW671), and stops in the westbound lane at the square-side kerb between the driveways at
  # OSM nodes 13718175880 and 13718175884 (orthophoto 0.25 m: 47 m of kerb without exits, no parking bay for an
  # articulated truck on the square; the paved square and the Czarniecki monument are not entered).
  - id: tykocin-dw671-to-rynek
    tile: tykocin
    destination: tykocin
    replaces_route: tykocin               # starts at the tykocin route start (seam dw671-tykocin-09 | tykocin)
    via_epsg2180: [[751892.77, 600222.959]]   # OSM node 1123400983: SE corner of the square, stays on DW671
    end_epsg2180: [751806.787, 600211.932]    # OSM node 13718175884 (DW671, south side of the square)
    stop_epsg2180: [751818.0, 600215.0]       # stop spot: westbound lane centre, ~12 m before that node's driveway
    # The right turn Puchalskiego -> south side of the square at node 1123400983 (carriageway 5 m, BDOT10k): on the lane
    # centre the semitrailer's right tyres cut the inner corner (30 tyre points off the hard surface at link s 1249-1256,
    # qa/link_swept_check.py). Swing wide 1.5 m left at the corner, raised cosine over +-25 m -> 0 off the hard surface,
    # 0 off the carriageway. Searched 1.0-3.0 m x 15-30 m: 1.0 m / 20 m still has 9 points on the kerb (WORKING_VALUE).
    swing:
      - {near_epsg2180: [751887.0, 600226.0], left_m: 1.5, half_m: 25.0}
    note: "DW671 Puchalskiego from dw671-tykocin-09 -> Narew bridge -> SE corner of Rynek -> stop on the south side of the square"
  # ADR 0278 tile 4 (krywlany-s24, D93): Ciolkowskiego leaves mickiewicza on the north seam of Dojlidy (mickiewicza route
  # exit), crosses the NW corner of Dojlidy (~87 m, OSM way 279881972) and enters bialystok-krywlany on the west seam of
  # Dojlidy (krywlany route entry). The krywlany route ends at the Dojlidy route entry (Dywizjonu 303, west edge).
  - id: dojlidy-ciolkowskiego-corner-to-krywlany
    tile: bialystok-dojlidy
    destination: dojlidy
    start_epsg2180: [779092.4, 591103.0]  # Ciolkowskiego on the mickiewicza | Dojlidy seam (mickiewicza route end)
    end_epsg2180: [779019.0, 591055.7]    # Ciolkowskiego on the Dojlidy | krywlany seam (krywlany route entry)
    head_from: route:bialystok-mickiewicza
    tail_to: route:bialystok-krywlany
    note: "Ciolkowskiego DW678 across the NW corner of Dojlidy from the seam with mickiewicza to the seam with krywlany"
# Driving corridors as ordered tile lists (Bialystok -> Knyszyn -> Tykocin, owner request s23). The generator keeps the
# prefix of tiles present in Data/Regions (main: up to dw671-tykocin-01; the ring branch world2-s23 adds
# dw671-tykocin-02..09 and tykocin) and checks every consecutive pair: edge neighbours (N/E/S/W) and a route join
# (route exit / link end of A == route entry / link start of B within PORTAL_TOL_M).
corridors:
  - id: bialystok-tykocin
    destination: tykocin
    tiles: [bialystok-industrial-c, bialystok-maczka, bialystok-kleeberga, bialystok-knyszynska,
            dk65-01, dk65-02, dk65-03, dk65-04, dk65-05, dk65-06, dk65-07, dk65-08, dk65-09, dk65-10, dk65-11,
            knyszyn-s, knyszyn, knyszyn-w, dw671-tykocin-01, dw671-tykocin-02, dw671-tykocin-03, dw671-tykocin-04,
            dw671-tykocin-05, dw671-tykocin-06, dw671-tykocin-07, dw671-tykocin-08, dw671-tykocin-09, tykocin]
  # ADR 0292: Bialystok C -> DK8 Kleeberga -> junction Bialystok Zachod -> S8 loop (`-route_to s8`)
  - id: bialystok-s8
    destination: s8
    tiles: [bialystok-industrial-c, bialystok-maczka, bialystok-kleeberga, bialystok-knyszynska, bialystok-porosly,
            dk8-s8-jeroniki, dk65-01, s8-01, s8-02, s8-03, s8-04, s8-05, s8-06, s8-07, s8-08, s8-09, s8-10, s8-11, s8-12]
  # D81: C -> wygoda -> bojary -> mickiewicza (ADR 0278 tiles 5-7). Ciolkowskiego leaves mickiewicza on the north seam
  # of bialystok-dojlidy, crosses the NW corner of Dojlidy (link dojlidy-ciolkowskiego-corner-to-krywlany, ~87 m) and
  # turns into bialystok-krywlany (ADR 0278 tile 4, krywlany-s24: rondo Wunschego, Dywizjonu 303, ~1205 m), then
  # re-enters Dojlidy at the Dojlidy route entry (west edge). Dojlidy is listed twice: corner link, then its route.
  - id: bialystok-dojlidy-dk19
    destination: dojlidy
    tiles: [bialystok-industrial-c, bialystok-wygoda, bialystok-bojary, bialystok-mickiewicza, bialystok-dojlidy,
            bialystok-krywlany, bialystok-dojlidy]
  - id: s8-loop
    destination: s8
    tiles: [dk65-01, s8-01, s8-02, s8-03, s8-04, s8-05, s8-06, s8-07, s8-08, s8-09, s8-10, s8-11, s8-12]
