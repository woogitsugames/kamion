# ADR 0303: authored_override of OSM tags for the in-game GPS routing graph (tools/worldgen/navgraph/build_route_graph.py).
# Survives reimport: applied by OSM way id on every rebuild of <region>_route.bytes; the world meshes do not use these tags.
schema: truck-sim-pl/osm-tag-fixes/1
fixes:
  - id: maxaxleload-10t-2017-regulation
    tag: maxaxleload
    only_value: "10"
    set: null            # no posted limit: art. 41 ust. 1 ustawy o drogach publicznych = 11.5 t on paved public roads
    reason: >-
      Every maxaxleload=10 way of the Bialystok - Knyszyn - Monki - Tykocin area (Overpass 2026-11-19, bbox 53.05-53.60 N,
      22.70-23.30 E: 78 ways - DK64, DK65, DW671 and others) carries source:maxaxleload = "Rozporzadzenie Ministra
      Infrastruktury i Budownictwa z dnia 21 kwietnia 2017 r" (bulk edit, OSM changeset 53384754, 2017-10-31, plus
      single later ways copying the tag). That regulation listed the roads open to 10 t axles under the old art. 41
      ust. 2 (Dz.U. 2017 poz. 878; ELI record eli.gov.pl/eli/DU/2017/878: "uznany za uchylony" 2021-03-13). The amendment Dz.U. 2021 poz. 54 (ustawa z 18 grudnia 2020, published 2021-01-11, in force 60 days later,
      13.03.2021) replaced it: art. 41 ust. 1 allows 11.5 t on public roads; lower limits (10 t / 8 t) only by sign B-19
      of the road manager or a gmina resolution (art. 41 ust. 2-3), 8 t on unpaved roads (art. 41b). No B-19 is mapped
      in OSM in the area (Overpass 2026-11-19); street-level photos not checked (Mapillary token invalid on 2026-11-19).
      A way with a real B-19 must be removed from this list (or mapped with a source newer than 2021-03-13).
