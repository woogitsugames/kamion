# ADR 0218 - prepared authored override for the roundabout DK65 x DW671 in Knyszyn (OSM way 1426801304).
# NOT applied by the task: the leader appends the entry below to `overrides:` in Data/Regions/knyszyn/overrides.yaml
# (command in docs/adr/0218-rondo-knyszyn-opaska-dla-naczepy.md) and rebuilds the region.
# Values: ring axis diameter 17.6 m SOURCED (OSM geometry, research/dk65-knyszyn-refs/README.md K1); ring asphalt
# 5.0 m ESTIMATED (outer diameter 22.6 m = lower bound of a single-lane roundabout per WR-D-31-3 as quoted
# secondary, UNVERIFIED on the roundabout itself); apron 3.2 m / 0.04 m lip / sett WORKING_VALUE from the swept path
# (tools/worldgen/roads/swept_path.py): on a 22.6 m circle the U-turn needs 2.90 m, left turn 262 deg (return
# Rynek -> Bialystok) 2.24 m; 3.2 m keeps 0.25 m clearance also in the tightest sector of the generated ring.
overrides:
  - id: knyszyn-roundabout-truck-apron
    target: {osm_way: [1426801304]}
    reason: >-
      Roundabout DK65 x DW671 (D65 p.2: as in OSM). OSM gives the ring axis only (diameter ~17.6 m, r 8.61-8.98 m);
      the BDOT10k width 4.0 m on two ring edges is from 2008, before the roundabout was built, so the ring width is
      set: 5.0 m asphalt (ESTIMATED, outer diameter 22.6 m). A 16.47 m tractor + 13.6 m semitrailer (art-source/truck/
      dims.json) straight on needs the inner tyre path down to r 5.89 m, left 262 deg 4.31 m, U-turn 3.65 m (ADR 0218,
      kinematic swept path, outer front tyre 0.5 m inside the outer kerb): the 6.3 m inner ring edge is not enough,
      so a mountable sett truck apron 3.2 m wide with a 4 cm lip is laid inside the ring; the island kerb face moves
      to r 3.1 m on a circle, 2.74-3.21 m on the generated ring (smoothed OSM axis r 8.44-8.91 m). Tightest sector
      (outer kerb r 10.94): U-turn tyre path r 3.03 = 0.29 m clear of the kerb face (>= 0.25 m clearance, ADR 0218,
      test_knyszyn_ring_sectors_clear_the_u_turn). Ring + apron 8.2 m (WR-D-31-3 range 6.0-8.5 m, secondary
      quote). Width, lip and island content
      UNVERIFIED on site (no orthophoto after construction) - owner photo of the island wanted.
    confidence: low
    verify: owner photo of the roundabout island and apron (ring width, apron width, kerb lip)
    set:
      width: 5.0
      truck_apron: {width_m: 3.2, height_m: 0.04, material: kostka}
