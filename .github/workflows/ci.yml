name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Model/physics dimension sync (ADR 0014)
        run: python3 tests/physics/test_dims_sync.py
      - name: Unit tests
        run: dotnet test tools/physics-runner/PhysicsRunner.sln -c Release --logger "trx;LogFileName=physics.trx"
      - name: Validation scenarios
        run: dotnet run -c Release --project tools/physics-runner/Runner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-results
          path: |
            tools/physics-runner/**/TestResults/*.trx
            artifacts/physics/**/summary.md
          if-no-files-found: ignore

  gis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: astral-sh/setup-uv@v6
      - name: GIS unit tests (pure functions, synthetic data, no Data/raw needed)
        run: uv run --project tools/worldgen pytest tests/gis -q -m unit
      - name: GIS tests (raw-data tests auto-skip)
        run: uv run --project tools/worldgen pytest tests/gis -q

  audio-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: astral-sh/setup-uv@v6
      - name: Audio tools tests (synthetic signals only, no repo audio files)
        run: uv run --project tools/audio --with pytest pytest tools/audio/tests -q

  lint:
    # NIEBLOKUJĄCY: continue-on-error + --exit-zero — lint raportuje, nie blokuje merge'u.
    # Wersje przypięte: ruff 0.17.5 (lokalny uvx 2026-11-12), PSScriptAnalyzer 1.25.0 (PSGallery 2026-11-12).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: astral-sh/setup-uv@v6
      - name: Ruff (tools/, tests/) - konfiguracja w ruff.toml
        run: uvx ruff@0.17.5 check tools tests --exit-zero
      - name: PSScriptAnalyzer (scripts/*.ps1)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -SkipPublisherCheck
          $found = Invoke-ScriptAnalyzer -Path scripts -Recurse
          $found | Select-Object ScriptName, Line, Severity, RuleName, Message |
            Format-Table -AutoSize | Out-String -Width 220
          "PSScriptAnalyzer: $(@($found).Count) findings (report only)"
