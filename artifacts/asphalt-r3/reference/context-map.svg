<text x='615' y='100' font-size='12'>Obrysy budynków: buildings.geojson</text>
<text x='615' y='122' font-size='12'>Niebieski: obiekt handlowy C92B</text>
<text x='615' y='144' font-size='12'>Punkt 4 leży w jego obrysie.</text>
<text x='615' y='166' font-size='12'></text>
<text x='615' y='188' font-size='12'>Beżowy: surowy obrys BDOT PTPL</text>
<text x='615' y='210' font-size='12'>Wejście opisane: masa bitumiczna.</text>
<text x='615' y='232' font-size='12'>To nie dowód materiału GLB.</text>
<text x='615' y='254' font-size='12'></text>
<text x='615' y='276' font-size='12'>Przerywana linia: bbox sondy GLB</text>
<text x='615' y='298' font-size='12'>E 280–480 / N −560 do −300.</text>
<text x='615' y='320' font-size='12'></text>
<text x='615' y='342' font-size='12'>Czerwony deseń od E=400:</text>
<text x='615' y='364' font-size='12'>konserwatywne wyłączenie zużycia</text>
<text x='615' y='386' font-size='12'>materiału Kwadrat z rundy 2.</text>
<text x='615' y='408' font-size='12'>Nie jest granicą własności terenu.</text>
<text x='615' y='430' font-size='12'></text>
<text x='615' y='452' font-size='12'>1 / 2 / 4: przybliżone punkty</text>
<text x='615' y='474' font-size='12'>metadanych sąsiednich zdjęć.</text>
<text x='615' y='496' font-size='12'>Zdjęcie 3: brak punktu GPS.</text>
<text x='615' y='518' font-size='12'></text>
<text x='615' y='540' font-size='12'>Nie ustalono dokładności GPS,</text>
<text x='615' y='562' font-size='12'>pozy zdjęcia placu ani jego zasięgu.</text>
<text x='615' y='584' font-size='12'>Wysokość placu: oczekuje sondy.</text>
<text x='615' y='606' font-size='12'></text>
<text x='615' y='628' font-size='12'>Widoczny fragment kontekstu;</text>
<text x='615' y='650' font-size='12'>bez zmian geometrii lub override.</text>
<text x='615' y='672' font-size='12'>Źródła i SHA: context-map.json.</text>
<text x="50" y="788" font-size="12">Mapa pomocnicza QA. Widoczne metadane nie są dopasowaniem fotografii ani pomiarem fizycznego materiału.</text></g></svg>